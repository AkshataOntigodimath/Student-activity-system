<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificates</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/teacher_certificates.css">
</head>

<body>

<div class="page-container">

    <!-- Header -->

    <div class="page-header">

        <div>
            <h1>Certificates</h1>
            <p>Generate and manage student certificates</p>
        </div>

        <button class="generate-all-btn">
            Generate All
        </button>

    </div>

    <!-- Statistics -->

    <div class="stats-container">

        <div class="stat-card">
            <h4>Total Certificates</h4>
            <h2>120</h2>
        </div>

        <div class="stat-card">
            <h4>Generated</h4>
            <h2>105</h2>
        </div>

        <div class="stat-card">
            <h4>Pending</h4>
            <h2>15</h2>
        </div>

        <div class="stat-card">
            <h4>Downloaded</h4>
            <h2>82</h2>
        </div>

    </div>

    <!-- Search -->

    <div class="search-section">

        <input
            type="text"
            id="searchInput"
            placeholder="Search Student..."
        >

        <select id="eventFilter">

            <option>All Events</option>
            <option>Hackathon</option>
            <option>Workshop</option>
            <option>Coding Contest</option>

        </select>

    </div>

    <!-- Table -->

    <div class="table-container">

        <table>

            <thead>

                <tr>

                    <th>Student</th>
                    <th>USN</th>
                    <th>Event</th>
                    <th>Status</th>
                    <th>Actions</th>

                </tr>

            </thead>

            <tbody>

                <tr>

                    <td>Rahul Kumar</td>
                    <td>4XX22EC001</td>
                    <td>Hackathon</td>

                    <td>
                        <span class="status generated">
                            Generated
                        </span>
                    </td>

                    <td>

                        <button class="view-btn">
                            View
                        </button>

                        <button class="download-btn">
                            Download
                        </button>

                    </td>

                </tr>

                <tr>

                    <td>Ananya Sharma</td>
                    <td>4XX22EC002</td>
                    <td>Workshop</td>

                    <td>
                        <span class="status pending">
                            Pending
                        </span>
                    </td>

                    <td>

                        <button class="generate-btn">
                            Generate
                        </button>

                        <button class="download-btn">
                            Download
                        </button>

                    </td>

                </tr>

                <tr>

                    <td>Akash Patil</td>
                    <td>4XX22EC003</td>
                    <td>Coding Contest</td>

                    <td>
                        <span class="status generated">
                            Generated
                        </span>
                    </td>

                    <td>

                        <button class="view-btn">
                            View
                        </button>

                        <button class="download-btn">
                            Download
                        </button>

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>

<script src="../js/teacher_certificates.js"></script>

</body>
</html>
