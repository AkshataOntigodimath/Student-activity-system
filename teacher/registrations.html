<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registrations</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/registrations.css">

</head>


<body>


<div class="page-container">


    <header class="page-header">

        <div>

            <h1>Student Registrations</h1>

            <p>Approve or reject student event registrations</p>

        </div>


    </header>



    <section class="registration-section">


        <table>


            <thead>

                <tr>

                    <th>Student Name</th>
                    <th>USN</th>
                    <th>Event</th>
                    <th>Date</th>
                    <th>Status</th>
                    <th>Action</th>

                </tr>

            </thead>



            <tbody>


                <tr>

                    <td>Rahul Kumar</td>

                    <td>4XX22EC001</td>

                    <td>Hackathon</td>

                    <td>15 July 2026</td>

                    <td>
                        <span class="status pending">
                            Pending
                        </span>
                    </td>


                    <td>

                        <button class="approve-btn">
                            Approve
                        </button>


                        <button class="reject-btn">
                            Reject
                        </button>

                    </td>


                </tr>



                <tr>

                    <td>Ananya Sharma</td>

                    <td>4XX22EC002</td>

                    <td>Robotics Workshop</td>

                    <td>22 July 2026</td>

                    <td>

                        <span class="status approved">
                            Approved
                        </span>

                    </td>


                    <td>

                        <button class="approve-btn">
                            Approve
                        </button>


                        <button class="reject-btn">
                            Reject
                        </button>

                    </td>


                </tr>


            </tbody>


        </table>


    </section>


</div>


<script src="../js/registrations.js"></script>


</body>

</html>
