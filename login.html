<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Student Activity System</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

<div class="container">

    <!-- Left Side -->
    <div class="left-panel">
        <h1>Student Activity System</h1>
        <p>
            One platform for Students, Teachers,
            Parents and Administrators to manage
            academics and activities efficiently.
        </p>

        <img src="images/login.png" alt="Login Image">
    </div>

    <!-- Right Side -->
    <div class="login-box">

        <h2>Welcome Back 👋</h2>
        <p>Please login to continue</p>

        <form>

            <label>Select Role</label>

            <select>
                <option>Student</option>
                <option>Teacher</option>
                <option>Parent</option>
                <option>Admin</option>
            </select>

            <label>Email</label>

            <input type="email"
            placeholder="Enter your email">

            <label>Password</label>

            <div class="password-box">
                <input type="password"
                placeholder="Enter password">

                <i class="fa-solid fa-eye"></i>
            </div>

            <button type="submit">
                Login
            </button>

        </form>

    </div>

</div>
<script src="js/login.js"></script>
</body>
</html>
